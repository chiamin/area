<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>算面積</title>
<style>
  :root {
    --bg:      #f6f7f9;
    --surface: #ffffff;
    --ink:     #2c2f36;
    --muted:   #9aa0ab;
    --line:    #e6e8ec;
    --grid:    #e4eef3;
    --shape:   rgba(70, 130, 180, 0.10);
    --shape-edge: #4a6b8a;
    --accent:  #4a6b8a;     /* 沉穩藍灰，作為唯一強調色 */
    --accent-soft: #eef2f6;
    --hint:    #c6792f;     /* 輔助線（系統提示）暖褐 */
    --pen:     #2c2f36;     /* 手寫筆輔助線 */
    --ok:      #4f9d6e;
    --no:      #c46a6a;
    --radius:  14px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: "Inter", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    color: var(--ink);
    background: var(--bg);
    -webkit-user-select: none; user-select: none;
    overflow: hidden;
  }

  /* ────────────────────────────────────────────
     首頁：極簡，列出所有形狀
     ──────────────────────────────────────────── */
  #home {
    height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 18px; padding: 24px;
    overflow: auto;
  }
  .hero {
    width: min(440px, 80vw);
    max-height: 26vh;
    object-fit: contain;
    margin-bottom: -4px;
  }
  #home h1 {
    font-size: 2.4rem; font-weight: 600; letter-spacing: 0.06em;
    margin: 0 0 4px; color: var(--ink);
  }
  /* 三大類選單：三個大選項各一排 */
  .menu {
    display: flex; flex-direction: column;
    gap: 14px;
    width: 100%; max-width: 360px;
  }
  .menu-item {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 22px 24px;
    cursor: pointer;
    display: flex; align-items: center; gap: 18px;
    transition: border-color .15s, transform .05s, box-shadow .15s;
  }
  .menu-item:hover { border-color: var(--accent); }
  .menu-item:active { transform: translateY(1px); }
  .menu-item .ic { display: block; flex: 0 0 auto; }
  .menu-item .nm { font-size: 1.3rem; color: var(--ink); }

  /* ────────────────────────────────────────────
     作答頁：全部塞進一個 iPad 直向畫面（不捲動）
     ──────────────────────────────────────────── */
  #game { height: 100%; display: none; flex-direction: column; }
  #game.show { display: flex; }

  .topbar {
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px; gap: 8px;
  }
  /* 加大的工具按鈕（上一頁／上一步／橡皮擦／全部擦掉） */
  .tool-btn {
    height: 48px; padding: 0 18px;
    border: 1px solid var(--line); background: var(--surface);
    border-radius: 12px; color: var(--ink);
    font-size: 1.05rem; cursor: pointer; font-family: inherit;
    display: inline-flex; align-items: center; justify-content: center;
    transition: border-color .15s, color .15s, background .15s;
  }
  .tool-btn:hover { border-color: var(--accent); color: var(--accent); }
  .tool-btn:active { transform: translateY(1px); }
  .tool-btn.on {            /* 橡皮擦啟用中 */
    background: var(--accent); color: #fff; border-color: var(--accent);
  }
  .topbar .right { display: flex; gap: 8px; }

  /* 畫布區：佔據主要空間 */
  .stage {
    flex: 1 1 auto;
    min-height: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 0 8px;
    position: relative;
  }
  .canvas-wrap {
    position: relative;
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    position: absolute;
    border-radius: 12px;
    touch-action: none;       /* 讓手寫筆 / 觸控完全交給我們處理 */
  }
  #board { background: var(--surface); border: 1px solid var(--line); }
  #ink   { background: transparent; }   /* 手寫層，疊在上面 */
  #ink.erasing { cursor: pointer; }

  .feedback {
    flex: 0 0 auto;
    height: 24px; text-align: center;
    font-size: 1.05rem; color: var(--muted);
  }
  .feedback.ok { color: var(--ok); }
  .feedback.no { color: var(--no); }

  /* 底部：左鍵盤 + 右側答案/動作，鍵盤因此能更大 */
  .bottom {
    flex: 0 0 auto;
    display: flex; align-items: stretch; justify-content: center;
    gap: 16px;
    padding: 4px 16px calc(12px + env(safe-area-inset-bottom));
    max-width: 720px; width: 100%; margin: 0 auto;
  }

  /* 數字鍵盤（放大） */
  .pad {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 9px;
    max-width: 440px;
  }
  .pad button {
    height: 62px;
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: 13px;
    font-size: 1.7rem; font-weight: 500; color: var(--ink);
    cursor: pointer;
    transition: background .12s, border-color .12s, transform .04s;
    font-family: inherit;
  }
  .pad button:hover { border-color: var(--accent); }
  .pad button:active { transform: translateY(1px); background: var(--accent-soft); }
  .pad button:disabled { color: var(--muted); background: var(--bg); cursor: default; }
  .pad .send {
    background: var(--accent); color: #fff; border-color: var(--accent);
    font-size: 1.3rem;
  }
  .pad .send:hover { filter: brightness(1.05); }
  .pad .del { color: var(--muted); font-size: 1.5rem; }

  /* 右側：答案 + 提示/下一題 */
  .side {
    flex: 0 0 auto;
    width: 150px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px;
  }
  .answer {
    display: flex; align-items: baseline; justify-content: center; gap: 8px;
    font-size: 1.4rem;
  }
  .answer .val {
    min-width: 72px; text-align: center;
    font-size: 2.1rem; font-weight: 600;
    border-bottom: 2px solid var(--line);
    padding-bottom: 2px;
    transition: border-color .15s;
  }
  .answer .val.empty { color: var(--muted); }
  .answer .val.filled { border-color: var(--accent); }
  .answer .unit { font-size: 1.1rem; color: var(--muted); }

  .pill {
    border: 1px solid var(--line); background: var(--surface);
    border-radius: 12px; padding: 12px 18px; width: 100%;
    font-size: 1.05rem; color: var(--ink); cursor: pointer;
    font-family: inherit;
    transition: border-color .15s, color .15s, background .15s;
  }
  .pill:hover { border-color: var(--accent); }
  .pill.accent { background: var(--accent); color: #fff; border-color: var(--accent); }
  .pill.hint { color: var(--hint); border-color: #ecd9c2; }
  .hidden { display: none !important; }

  /* 慶祝 */
  #celebrate {
    position: fixed; inset: 0; z-index: 50;
    display: none; align-items: center; justify-content: center;
    background: rgba(246,247,249,0.92);
    backdrop-filter: blur(3px);
    flex-direction: column; gap: 10px;
  }
  #celebrate.show { display: flex; }
  #celebrate .mark {
    width: 96px; height: 96px; border-radius: 50%;
    border: 3px solid var(--ok);
    display: flex; align-items: center; justify-content: center;
    animation: pop .4s ease;
  }
  #celebrate .mark svg { stroke: var(--ok); }
  #celebrate .txt { font-size: 1.4rem; color: var(--ink); letter-spacing: .05em; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
</style>
</head>
<body>

<!-- ───────────── 首頁 ───────────── -->
<main id="home">
  <img class="hero" src="assets/images/happy.png" alt="" />
  <h1>算面積</h1>
  <div id="menu"></div>
</main>

<!-- ───────────── 作答頁 ───────────── -->
<main id="game">
  <div class="topbar">
    <button class="tool-btn" id="homeBtn">‹ 上一頁</button>
    <div class="right">
      <button class="tool-btn" id="undoBtn">↶ 上一步</button>
      <button class="tool-btn" id="eraserBtn">橡皮擦</button>
      <button class="tool-btn" id="clearInkBtn">全部擦掉</button>
    </div>
  </div>

  <div class="stage">
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="board"></canvas>
      <canvas id="ink"></canvas>
    </div>
  </div>

  <div class="feedback" id="feedback"></div>

  <!-- 底部：左鍵盤 + 右側答案/動作 -->
  <div class="bottom">
    <div class="pad" id="pad">
      <button data-d="1">1</button>
      <button data-d="2">2</button>
      <button data-d="3">3</button>
      <button data-d="4">4</button>
      <button data-d="5">5</button>
      <button data-d="6">6</button>
      <button data-d="7">7</button>
      <button data-d="8">8</button>
      <button data-d="9">9</button>
      <button class="del" id="delBtn">⌫</button>
      <button data-d="0">0</button>
      <button class="send" id="sendBtn">送出</button>
    </div>

    <div class="side">
      <div class="answer">
        <span class="val empty" id="answerVal">?</span>
        <span class="unit">格</span>
      </div>
      <button class="pill hint hidden" id="hintBtn">提示</button>
      <button class="pill accent hidden" id="nextBtn">下一題</button>
    </div>
  </div>
</main>

<!-- 慶祝 -->
<div id="celebrate">
  <div class="mark">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 13l4 4L19 7" />
    </svg>
  </div>
  <div class="txt" id="celeText">完成！</div>
</div>

<script>
"use strict";

/* ============================================================
   音效：預熱池 + iOS 解鎖（沿用原機制）
   ============================================================ */
const SOUND_FILES = { ding: 'ding.mp3', eoh: 'eoh.mp3', cheer: 'cheer.mp3' };
const SOUND_BASE = 'assets/sounds/';
const POOL_SIZE = 3;
const pools = { ding: [], eoh: [], cheer: [] };
function makeElement(name) {
  const el = new Audio(SOUND_BASE + SOUND_FILES[name]);
  el.preload = 'auto'; el.load();
  return el;
}
for (const name of Object.keys(SOUND_FILES))
  for (let i = 0; i < POOL_SIZE; i++) pools[name].push(makeElement(name));

let audioUnlocked = false, unlockInFlight = false;
function unlockSounds() {
  if (audioUnlocked || unlockInFlight) return;
  unlockInFlight = true;
  const dummy = new Audio(SOUND_BASE + SOUND_FILES.ding);
  dummy.muted = true;
  dummy.play().then(() => { audioUnlocked = true; unlockInFlight = false; })
              .catch(() => { unlockInFlight = false; });
}
const uh = () => unlockSounds();
document.addEventListener('touchstart', uh, { capture: true, passive: true });
document.addEventListener('touchend', uh, { capture: true, passive: true });
document.addEventListener('mousedown', uh, { capture: true });
document.addEventListener('click', uh, { capture: true });
function playSound(name) {
  const pool = pools[name];
  let el = pool.find((e) => e.paused || e.ended);
  if (!el) el = makeElement(name);
  else if (el.currentTime !== 0) el.currentTime = 0;
  el.play().catch(() => {});
}

/* ============================================================
   幾何工具 + 形狀產生器（沿用已驗證邏輯）
   座標為格子座標（左上原點，y 向下）。面積保證為整數。
   ============================================================ */
function polygonArea(pts) {
  let s = 0;
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = pts[(i + 1) % pts.length];
    s += a.x * b.y - b.x * a.y;
  }
  return Math.abs(s) / 2;
}
function rint(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function choice(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function rEvenSide(min, max) {
  const lo = min % 2 === 0 ? min : min + 1;
  const hi = max % 2 === 0 ? max : max - 1;
  const n = (hi - lo) / 2;
  return lo + 2 * Math.floor(Math.random() * (n + 1));
}
function placeShape(pts, gridW, gridH) {
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const offX = Math.floor((gridW - (maxX - minX)) / 2) - minX;
  const offY = Math.floor((gridH - (maxY - minY)) / 2) - minY;
  return pts.map(p => ({ x: p.x + offX, y: p.y + offY }));
}
function bboxOf(pts) {
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  return { minX: Math.min(...xs), maxX: Math.max(...xs), minY: Math.min(...ys), maxY: Math.max(...ys) };
}

function genRect(gridW, gridH) {
  const w = rint(2, Math.min(7, gridW - 2));
  const h = rint(2, Math.min(7, gridH - 2));
  let pts = placeShape([{x:0,y:0},{x:w,y:0},{x:w,y:h},{x:0,y:h}], gridW, gridH);
  return { kind:'rect', pts, area: polygonArea(pts), hints: gridLinesHint(pts) };
}
function genRightTriangle(gridW, gridH) {
  const w = rEvenSide(2, Math.min(6, gridW - 2));
  const h = rint(2, Math.min(7, gridH - 2));
  const variants = [
    [{x:0,y:0},{x:w,y:0},{x:0,y:h}],
    [{x:0,y:0},{x:w,y:0},{x:w,y:h}],
    [{x:w,y:0},{x:w,y:h},{x:0,y:h}],
    [{x:0,y:0},{x:w,y:h},{x:0,y:h}],
  ];
  let pts = placeShape(choice(variants), gridW, gridH);
  return { kind:'rtri', pts, area: polygonArea(pts), hints: bboxHint() };
}
function genTriangle(gridW, gridH) {
  const w = rEvenSide(4, Math.min(6, gridW - 2));
  const h = rint(2, Math.min(6, gridH - 2));
  const apex = rint(0, w);
  let pts = placeShape([{x:0,y:h},{x:w,y:h},{x:apex,y:0}], gridW, gridH);
  return { kind:'tri', pts, area: polygonArea(pts), hints: bboxHint() };
}
function genParallelogram(gridW, gridH) {
  const base = rint(3, Math.min(6, gridW - 3));
  const h = rint(2, Math.min(5, gridH - 2));
  const slant = rint(1, 2);
  let pts = placeShape([{x:0,y:h},{x:base,y:h},{x:base+slant,y:0},{x:slant,y:0}], gridW, gridH);
  const bb = bboxOf(pts);
  return {
    kind:'para', pts, area: polygonArea(pts),
    hints: [
      { type:'seg', a:{x:pts[3].x,y:bb.minY}, b:{x:pts[3].x,y:bb.maxY} },
      { type:'bbox' },
    ],
  };
}
function genTrapezoid(gridW, gridH) {
  const bottom = rint(4, Math.min(7, gridW - 2));
  const maxInset = Math.floor((bottom - 1) / 2);
  const topInset = rint(1, Math.max(1, maxInset));
  const top = bottom - 2 * topInset;
  const h = rint(2, Math.min(5, gridH - 2));
  let pts = placeShape([{x:0,y:h},{x:bottom,y:h},{x:topInset+top,y:0},{x:topInset,y:0}], gridW, gridH);
  const bb = bboxOf(pts);
  return {
    kind:'trap', pts, area: polygonArea(pts),
    hints: [
      { type:'seg', a:{x:pts[3].x,y:bb.minY}, b:{x:pts[3].x,y:bb.maxY} },
      { type:'seg', a:{x:pts[2].x,y:bb.minY}, b:{x:pts[2].x,y:bb.maxY} },
    ],
  };
}
function genDiamond(gridW, gridH) {
  const hw = rint(2, 3), hh = rint(2, 3);
  const cx = hw, cy = hh;
  let pts = placeShape([{x:cx,y:0},{x:cx+hw,y:cy},{x:cx,y:cy+hh},{x:cx-hw,y:cy}], gridW, gridH);
  return { kind:'diamond', pts, area: polygonArea(pts), hints: bboxHint() };
}
function genCompound(gridW, gridH) {
  const a = rint(2,4), b = rint(2,4), c = rint(2,4), d = rint(2,4);
  let pts = placeShape(
    [{x:0,y:0},{x:a,y:0},{x:a,y:b},{x:a+c,y:b},{x:a+c,y:b+d},{x:0,y:b+d}], gridW, gridH);
  const bb = bboxOf(pts);
  const splitX = pts[1].x;
  return {
    kind:'comp', pts, area: polygonArea(pts),
    hints: [ { type:'seg', a:{x:splitX,y:bb.minY}, b:{x:splitX,y:bb.maxY} } ],
  };
}

function gridLinesHint(pts) {
  const bb = bboxOf(pts); const hints = [];
  for (let x = bb.minX + 1; x < bb.maxX; x++)
    hints.push({ type:'seg', a:{x,y:bb.minY}, b:{x,y:bb.maxY}, soft:true });
  for (let y = bb.minY + 1; y < bb.maxY; y++)
    hints.push({ type:'seg', a:{x:bb.minX,y}, b:{x:bb.maxX,y}, soft:true });
  return hints;
}
function bboxHint() { return [ { type:'bbox' } ]; }

/* ============================================================
   形狀類型清單（首頁選單 + 隨機）
   ============================================================ */
// 首頁三大類；點下去隨機出該類所有形狀
const CATEGORIES = [
  { key:'tri',  name:'三角形', icon:'tri',  gens: [genRightTriangle, genTriangle] },
  { key:'quad', name:'四邊形', icon:'para', gens: [genRect, genParallelogram, genTrapezoid, genDiamond] },
  { key:'poly', name:'多邊形', icon:'comp', gens: [genCompound] },
];

const GRID_W = 12, GRID_H = 12;
const SET_SIZE = 5;          // 一組幾題
const HINT_AFTER_WRONG = 3;  // 答錯幾次後出現提示

/* ============================================================
   遊戲狀態
   ============================================================ */
const state = {
  gens: CATEGORIES[0].gens,   // 目前出題用的產生器集合
  qNum: 0,
  shape: null,
  input: '',
  wrongCount: 0,
  hintsShown: 0,
  hintMode: false,
  solved: false,
  submitting: false,
  strokes: [],      // 手寫輔助線：每條是 {a:{px,py}, b:{px,py}}（畫布像素座標，存比例）
};

/* ============================================================
   DOM
   ============================================================ */
const $ = (id) => document.getElementById(id);
const homeEl = $('home'), gameEl = $('game'), menuEl = $('menu');
const board = $('board'), ink = $('ink');
const wrap = $('canvasWrap');
const bctx = board.getContext('2d');
const ictx = ink.getContext('2d');
const answerVal = $('answerVal'), feedbackEl = $('feedback');
const hintBtn = $('hintBtn'), nextBtn = $('nextBtn'), eraserBtn = $('eraserBtn');
const padEl = $('pad'), celebrate = $('celebrate'), celeText = $('celeText');

/* ============================================================
   首頁
   ============================================================ */
function shapeIcon(key, size) {
  const s = size, p = 6;       // padding
  const w = s - p*2;
  const map = {
    rect: `<rect x="${p+w*0.1}" y="${p+w*0.18}" width="${w*0.8}" height="${w*0.64}"/>`,
    rtri: `<path d="M${p} ${s-p} L${s-p} ${s-p} L${p} ${p} Z"/>`,
    tri:  `<path d="M${p} ${s-p} L${s-p} ${s-p} L${s*0.55} ${p} Z"/>`,
    para: `<path d="M${p+w*0.18} ${s-p} L${s-p} ${s-p} L${s-p-w*0.18} ${p} L${p} ${p} Z"/>`,
    trap: `<path d="M${p} ${s-p} L${s-p} ${s-p} L${s-p-w*0.22} ${p} L${p+w*0.22} ${p} Z"/>`,
    diam: `<path d="M${s/2} ${p} L${s-p} ${s/2} L${s/2} ${s-p} L${p} ${s/2} Z"/>`,
    comp: `<path d="M${p} ${p} L${s*0.55} ${p} L${s*0.55} ${s*0.55} L${s-p} ${s*0.55} L${s-p} ${s-p} L${p} ${s-p} Z"/>`,
  };
  return `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 ${s} ${s}"
            fill="none" stroke="#4a6b8a" stroke-width="2" stroke-linejoin="round">${map[key]}</svg>`;
}
function renderMenu() {
  menuEl.innerHTML = '';
  const grid = document.createElement('div');
  grid.className = 'menu';
  CATEGORIES.forEach(c => {
    const el = document.createElement('div');
    el.className = 'menu-item';
    el.innerHTML = shapeIcon(c.icon, 40) + `<span class="nm">${c.name}</span>`;
    el.addEventListener('click', () => startSet(c.gens));
    grid.appendChild(el);
  });
  menuEl.appendChild(grid);
}

function startSet(gens) {
  unlockSounds();
  state.gens = gens;
  state.qNum = 0;
  homeEl.style.display = 'none';
  gameEl.classList.add('show');
  // 等版面就緒再量尺寸
  requestAnimationFrame(() => { resizeCanvas(); nextQuestion(); });
}
function goHome() {
  gameEl.classList.remove('show');
  homeEl.style.display = 'flex';
}

/* ============================================================
   出題
   ============================================================ */
function nextQuestion() {
  state.shape = choice(state.gens)(GRID_W, GRID_H);
  state.input = '';
  state.wrongCount = 0;
  state.hintsShown = 0;
  state.hintMode = false;
  state.solved = false;
  state.submitting = false;
  state.strokes = [];

  hintBtn.classList.add('hidden');
  nextBtn.classList.add('hidden');
  setFeedback('', '');
  updateAnswer();
  setPadEnabled(true);
  clearInk();
  if (eraseMode) toggleEraser();   // 新題回到畫線模式
  draw();
}

/* ============================================================
   尺寸 / 座標
   ============================================================ */
let cell = 40, originX = 0, originY = 0, dpr = 1;

function resizeCanvas() {
  dpr = window.devicePixelRatio || 1;
  const rect = wrap.getBoundingClientRect();
  // 正方形畫布，取可用區域短邊
  const size = Math.floor(Math.min(rect.width, rect.height));
  [board, ink].forEach(cv => {
    cv.style.width = size + 'px';
    cv.style.height = size + 'px';
    cv.width = Math.floor(size * dpr);
    cv.height = Math.floor(size * dpr);
  });
  // 邏輯：(GRID + 邊距2) 格塞進 size。邊距小一點 → 格子更大。
  const margin = 0.5;
  cell = (size * dpr) / (GRID_W + margin * 2);
  originX = cell * margin;
  originY = cell * margin;
  draw();
}
window.addEventListener('resize', () => { if (gameEl.classList.contains('show')) resizeCanvas(); });

function gx(x) { return originX + x * cell; }   // 格→畫布像素
function gy(y) { return originY + y * cell; }

/* ============================================================
   繪圖：底層方格 + 形狀 + 系統提示輔助線
   ============================================================ */
function draw() {
  const W = board.width, H = board.height;
  bctx.clearRect(0, 0, W, H);
  bctx.fillStyle = '#ffffff';
  bctx.fillRect(0, 0, W, H);

  // 方格
  bctx.lineWidth = Math.max(1, dpr);
  bctx.strokeStyle = getCss('--grid');
  for (let i = 0; i <= GRID_W; i++) line(bctx, gx(i), gy(0), gx(i), gy(GRID_H));
  for (let j = 0; j <= GRID_H; j++) line(bctx, gx(0), gy(j), gx(GRID_W), gy(j));

  const shape = state.shape;
  if (!shape) return;

  if (state.hintMode) drawHints();

  // 形狀
  bctx.beginPath();
  shape.pts.forEach((p, i) => { const X = gx(p.x), Y = gy(p.y); i ? bctx.lineTo(X, Y) : bctx.moveTo(X, Y); });
  bctx.closePath();
  bctx.fillStyle = getCss('--shape');
  bctx.fill();
  bctx.lineWidth = 2.5 * dpr;
  bctx.lineJoin = 'round';
  bctx.strokeStyle = getCss('--shape-edge');
  bctx.stroke();
}

function drawHints() {
  const shape = state.shape;
  const shown = shape.hints.slice(0, state.hintsShown);
  shown.forEach(h => {
    bctx.save();
    bctx.setLineDash([7 * dpr, 5 * dpr]);
    if (h.type === 'bbox') {
      const bb = bboxOf(shape.pts);
      bctx.lineWidth = 2 * dpr;
      bctx.strokeStyle = getCss('--hint');
      bctx.strokeRect(gx(bb.minX), gy(bb.minY), (bb.maxX-bb.minX)*cell, (bb.maxY-bb.minY)*cell);
    } else if (h.type === 'seg') {
      bctx.lineWidth = (h.soft ? 1.5 : 2) * dpr;
      bctx.strokeStyle = h.soft ? '#dcc6a8' : getCss('--hint');
      line(bctx, gx(h.a.x), gy(h.a.y), gx(h.b.x), gy(h.b.y));
    }
    bctx.restore();
  });
}

function line(ctx, x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }
function getCss(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

/* ============================================================
   手寫筆 / 觸控：自由手繪 → 放開自動拉直成一條線
   strokes 存「比例座標」(0~1)，重繪時乘上畫布尺寸，縮放也不跑位。
   ============================================================ */
let drawingStroke = null;   // { pts:[{x,y}...] } 原始軌跡（比例座標），即時預覽
let pointerActive = false;
let eraseMode = false;      // 橡皮擦模式

function toRatio(e) {
  const rect = ink.getBoundingClientRect();
  return { x: (e.clientX - rect.left) / rect.width, y: (e.clientY - rect.top) / rect.height };
}

// 點 p 到線段 ab 的距離（比例座標）
function distToSeg(p, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const len2 = dx*dx + dy*dy;
  let t = len2 ? ((p.x-a.x)*dx + (p.y-a.y)*dy) / len2 : 0;
  t = Math.max(0, Math.min(1, t));
  const cx = a.x + t*dx, cy = a.y + t*dy;
  return Math.hypot(p.x - cx, p.y - cy);
}
// 擦掉最靠近 p 的一條手寫線（在門檻內才擦）
function eraseAt(p) {
  let best = -1, bestD = 0.04;   // 約 4% 畫布寬的命中範圍
  state.strokes.forEach((s, i) => {
    const d = distToSeg(p, s.a, s.b);
    if (d < bestD) { bestD = d; best = i; }
  });
  if (best >= 0) { state.strokes.splice(best, 1); renderInk(false); }
}

function toggleEraser() {
  eraseMode = !eraseMode;
  eraserBtn.classList.toggle('on', eraseMode);
  ink.classList.toggle('erasing', eraseMode);
}

ink.addEventListener('pointerdown', (e) => {
  if (state.solved) return;
  if (eraseMode) { eraseAt(toRatio(e)); e.preventDefault(); return; }
  // 只接受筆 / 滑鼠 / 觸控；忽略多指
  pointerActive = true;
  ink.setPointerCapture(e.pointerId);
  drawingStroke = { pts: [toRatio(e)] };
  e.preventDefault();
});
ink.addEventListener('pointermove', (e) => {
  if (eraseMode) {
    if (e.buttons || e.pressure > 0) eraseAt(toRatio(e));  // 按住拖曳也能擦
    return;
  }
  if (!pointerActive || !drawingStroke) return;
  drawingStroke.pts.push(toRatio(e));
  renderInk(true);
  e.preventDefault();
});
function endStroke(e) {
  if (!pointerActive || !drawingStroke) return;
  pointerActive = false;
  // 把放開瞬間的位置也納入，終點才精準（pointerup 帶座標時）
  if (e && typeof e.clientX === 'number') drawingStroke.pts.push(toRatio(e));
  const pts = drawingStroke.pts;
  drawingStroke = null;
  // 拉直：用首尾點當線段端點（自由手繪 → 自動拉直）
  if (pts.length >= 2) {
    const a = pts[0], b = pts[pts.length - 1];
    const dist = Math.hypot((b.x-a.x), (b.y-a.y));
    if (dist > 0.03) state.strokes.push({ a, b });   // 太短的點忽略
  }
  renderInk(false);
  if (e) e.preventDefault();
}
ink.addEventListener('pointerup', endStroke);
ink.addEventListener('pointercancel', endStroke);
ink.addEventListener('pointerleave', (e) => { if (pointerActive) endStroke(e); });

function renderInk(previewing) {
  const W = ink.width, H = ink.height;
  ictx.clearRect(0, 0, W, H);
  ictx.lineCap = 'round';
  ictx.strokeStyle = getCss('--pen');
  ictx.lineWidth = 2.5 * dpr;
  // 已完成的直線
  state.strokes.forEach(s => line(ictx, s.a.x*W, s.a.y*H, s.b.x*W, s.b.y*H));
  // 預覽：畫使用者目前的原始軌跡（細一點、半透明），放開才拉直
  if (previewing && drawingStroke && drawingStroke.pts.length) {
    ictx.save();
    ictx.globalAlpha = 0.45;
    ictx.beginPath();
    drawingStroke.pts.forEach((p, i) => { i ? ictx.lineTo(p.x*W, p.y*H) : ictx.moveTo(p.x*W, p.y*H); });
    ictx.stroke();
    ictx.restore();
  }
}
function clearInk() { state.strokes = []; ictx.clearRect(0, 0, ink.width, ink.height); }
function undoStroke() { state.strokes.pop(); renderInk(false); }

$('clearInkBtn').addEventListener('click', clearInk);
$('undoBtn').addEventListener('click', undoStroke);
eraserBtn.addEventListener('click', toggleEraser);

/* ============================================================
   輸入 / 判分
   ============================================================ */
function updateAnswer() {
  if (state.input === '') { answerVal.textContent = '?'; answerVal.className = 'val empty'; }
  else { answerVal.textContent = state.input; answerVal.className = 'val filled'; }
}
function setFeedback(text, kind) {
  feedbackEl.textContent = text || '';
  feedbackEl.className = 'feedback' + (kind ? ' ' + kind : '');
}
function setPadEnabled(on) { padEl.querySelectorAll('button').forEach(b => b.disabled = !on); }

function appendDigit(d) {
  unlockSounds();
  if (state.submitting || state.solved) return;
  if (state.input.length >= 3) return;
  state.input += String(d); updateAnswer();
}
function backspace() {
  if (state.submitting || state.solved) return;
  state.input = state.input.slice(0, -1); updateAnswer();
}
function submitAnswer() {
  unlockSounds();
  if (state.submitting || state.solved) return;
  if (state.input === '') { setFeedback('先輸入答案', ''); return; }
  if (parseInt(state.input) === state.shape.area) onCorrect();
  else onWrong();
}
function onWrong() {
  playSound('eoh');
  state.wrongCount++;
  setFeedback('再試試', 'no');
  state.input = ''; updateAnswer();
  if (state.wrongCount >= HINT_AFTER_WRONG && !state.hintMode) hintBtn.classList.remove('hidden');
}
function onCorrect() {
  playSound('ding');
  state.solved = true; state.submitting = true;
  setFeedback('答對了', 'ok');
  setPadEnabled(false);
  hintBtn.classList.add('hidden');
  setTimeout(() => {
    state.qNum++;
    if (state.qNum >= SET_SIZE) finishSet();
    else { state.submitting = false; nextBtn.classList.remove('hidden'); }
  }, 800);
}

/* ============================================================
   提示：逐步顯示系統輔助線
   ============================================================ */
function showHint() {
  unlockSounds();
  state.hintMode = true;
  if (state.hintsShown < state.shape.hints.length) state.hintsShown++;
  hintBtn.textContent = (state.hintsShown >= state.shape.hints.length) ? '提示（已全部）' : '再一點提示';
  draw();
}

/* ============================================================
   完成一組 → 慶祝
   ============================================================ */
function finishSet() {
  playSound('cheer');
  celeText.textContent = choice(['完成！', '全對！', '太棒了！']);
  celebrate.classList.add('show');
  setTimeout(() => { celebrate.classList.remove('show'); goHome(); }, 2600);
}

/* ============================================================
   事件
   ============================================================ */
padEl.querySelectorAll('button[data-d]').forEach(b =>
  b.addEventListener('click', () => appendDigit(parseInt(b.dataset.d))));
$('delBtn').addEventListener('click', backspace);
$('sendBtn').addEventListener('click', submitAnswer);
hintBtn.addEventListener('click', showHint);
nextBtn.addEventListener('click', () => { nextBtn.classList.add('hidden'); nextQuestion(); });
$('homeBtn').addEventListener('click', goHome);

document.addEventListener('keydown', (e) => {
  if (!gameEl.classList.contains('show')) return;
  if (e.key >= '0' && e.key <= '9') appendDigit(parseInt(e.key));
  else if (e.key === 'Backspace') backspace();
  else if (e.key === 'Enter') submitAnswer();
});

/* ============================================================
   啟動
   ============================================================ */
renderMenu();
</script>
</body>
</html>
